name: Release preparation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed main commit SHA (40 lowercase hex characters)
        type: string
        required: true

# Preparation only: no publisher, environment, write or OIDC permissions.
permissions:
  contents: read
  actions: read

concurrency:
  group: release-preparation-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  UV_MANAGED_PYTHON: 'true'
  RELEASE_VERSION: '0.1.0'
  EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  prepare:
    name: Prepare canonical candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
      EXPECTED_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.12'
          enable-cache: false
      - name: Sync locked environment
        run: uv sync --locked
      - name: Require exact main dispatch
        run: >-
          uv run --locked python scripts/release.py check-source
          --expected-sha "$EXPECTED_SOURCE_SHA" --expected-version "$RELEASE_VERSION" --require-main
      - name: Require successful exact-source main push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$EXPECTED_SOURCE_SHA" --limit 1 --json databaseId,headSha,headBranch,event,workflowName,status,conclusion > reports/source-ci.json
          uv run --locked python scripts/release.py check-source --expected-sha "$EXPECTED_SOURCE_SHA" --expected-version "$RELEASE_VERSION" --require-main --ci-report reports/source-ci.json
      - name: Record environment
        run: uv run --locked python scripts/ci.py environment
      - name: Quality and schema
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src tests scripts
          uv run --locked python scripts/schema.py --check
      - name: Build canonical archives once
        run: uv build --out-dir dist --no-create-gitignore --build-constraint build-constraints.txt --require-build-hashes
      - name: Bundle exact files, checked schema and provenance
        run: >-
          uv run --locked python scripts/release.py bundle
          --archives dist --output reports/release-candidate
          --expected-sha "$EXPECTED_SOURCE_SHA" --expected-version "$RELEASE_VERSION"
          --require-main --ci-report reports/source-ci.json
      - name: Retain canonical candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r03-candidate-${{ github.sha }}
          path: reports/release-candidate/
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Retain preparation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r03-preparation-reports
          path: |
            reports/environment.json
            reports/source-ci.json
          retention-days: 90
          if-no-files-found: warn

  verify:
    name: Candidate (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, runner: ubuntu-24.04, python: '3.12'}
          - {os: linux, runner: ubuntu-24.04, python: '3.13'}
          - {os: linux, runner: ubuntu-24.04, python: '3.14'}
          - {os: linux, runner: ubuntu-24.04, python: '3.15'}
          - {os: macos, runner: macos-15, python: '3.12'}
          - {os: windows, runner: windows-2025, python: '3.12'}
    env:
      UV_PYTHON: ${{ matrix.python }}
      EXPECTED_PYTHON: ${{ matrix.python }}
      ENRAMA_RELEASE_BUNDLE: reports/release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r03-candidate-${{ github.sha }}
          path: reports/release-candidate
          digest-mismatch: error
      - name: Sync locked environment
        run: uv sync --locked
      - name: Record actual interpreter
        run: uv run --locked python scripts/ci.py environment
      - name: Verify and consume canonical wheel and sdist
        run: uv run --locked pytest tests/integration/test_distribution.py::test_install_outside_checkout --junitxml=reports/pytest.xml
      - name: Require positive successful consumer evidence
        run: uv run --locked python scripts/ci.py report
      - name: Verify build inputs remain unchanged
        if: always()
        run: git diff --exit-code -- pyproject.toml uv.lock .python-version build-constraints.txt
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r03-verify-${{ matrix.os }}-py${{ matrix.python }}-reports
          path: |
            reports/environment.json
            reports/pytest.xml
            reports/tests.json
          retention-days: 90
          if-no-files-found: warn
